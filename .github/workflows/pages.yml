name: Pages

# Publishes the site together with the EPI app. `enablement: true` turns Pages
# on for the repository the first time this runs, so no manual setup is needed.
on:
  push:
    branches:
      - claude/medical-space-startup-site-gyhj9w
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Collect the site
        run: |
          mkdir -p _site
          cp -r assets aplikacja en _site/
          cp ./*.html _site/
          rm -f _site/aplikacja/README.md
          ls -R _site | head -40

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
