name: Android APK

# Builds the EPI app as an installable APK. The web app is copied into the
# Android project at build time, so this workflow tracks changes in aplikacja/
# as well as in android/.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Opublikuj wydanie z tym tagiem (np. v0.1.0). Puste — tylko artefakt przebiegu.'
        required: false
        default: ''
  push:
    branches: ['**']
    paths:
      - 'android/**'
      - 'aplikacja/**'
      - '.github/workflows/android.yml'
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Name the artifact
        id: apk
        run: |
          # A fixed file name keeps releases/latest/download/epi-android.apk
          # working as a permanent link from the site.
          cp android/app/build/outputs/apk/debug/app-debug.apk epi-android.apk
          echo "path=epi-android.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: epi-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error

      - name: Publish the APK with the release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: EPI ${{ github.event.inputs.release_tag || github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          body: |
            Aplikacja EPI — prototyp. APK jest podpisany kluczem debugowym,
            instalacja wymaga zgody „Zainstaluj nieznane aplikacje".
