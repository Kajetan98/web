# Konfiguracja aplikacji EPI dla XIAO nRF54L15 (Sense).
# Budowane w nRF Connect SDK: west build -b xiao_nrf54l15/nrf54l15/cpuapp

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048

# Sprzęt
CONFIG_GPIO=y
CONFIG_PWM=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_SENSOR=y
CONFIG_LSM6DSO=n
CONFIG_LSM6DSL=n
# IMU na płytce Sense: LSM6DS3TR-C. Sterownik wybierany przez devicetree,
# nazwa opcji do sprawdzenia w wersji SDK (CONFIG_LSM6DSO / CONFIG_LSM6DS3TR_C).

# Zasilanie
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_POWEROFF=y

# Bluetooth: peryferium z profilami, których szuka aplikacja
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="EPI"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=1
CONFIG_BT_GATT_DYNAMIC_DB=n
CONFIG_BT_HRS=y
CONFIG_BT_BAS=y
CONFIG_BT_SMP=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=y
CONFIG_SETTINGS=y
CONFIG_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y

# Logi tylko w kompilacji rozwojowej
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
